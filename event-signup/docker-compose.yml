services:
  postgres:
    image: postgres:18
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-event_signup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-event_signup_dev}
      POSTGRES_DB: ${POSTGRES_DB:-event_signup}
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
